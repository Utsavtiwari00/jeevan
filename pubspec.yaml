name: jeevan
description: "Jeevan (जीवन) — Smart precision agriculture"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  camera: ^0.11.1
  connectivity_plus: ^6.1.4
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  video_player: ^2.11.1
  webview_flutter: ^4.14.1
  flutter_webrtc: ^1.6.0
  http: ^1.6.0
  firebase_core: ^3.12.1
  firebase_database: ^11.3.4
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
